name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    # A throwaway Postgres 18 for tests/pg-race.test.ts: every migration from
    # empty, and two bookings of one time at once (docs/test-plan.md § 2).
    # No password: it trusts local connections and lives as long as the job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          PG_TEST_URL: postgres://postgres@localhost:5432/booking_test
      - run: npm run build
      - name: noindex on the built app
        run: |
          npx next start -p 3400 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3400/ && break; sleep 1; done
          npm run check:noindex -- http://localhost:3400

  # Staging deploy to Rempire's Vercel team (kickoff §11; Dim, 17.11.2026).
  # Dim's own Vercel login is not a member of that team, so CI deploys with a
  # token created on the team's account and scoped to the rempire-booking
  # project only (docs/staging-setup.md). The project and its domain were set
  # up in the dashboard; their IDs are repo variables, not secrets. Until the
  # VERCEL_TOKEN secret exists, this job only prints a notice.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DOMAIN: rempire-booking.diipsolutions.eu
      # the two-address trial (docs/launch.md, B3): SITE_URL and STAFF_URL's hosts
      TRIAL_HOSTS: book-rempire.diipsolutions.eu staff-rempire.diipsolutions.eu
      VERCEL_CLI: vercel@65.15.0
    steps:
      - name: Token check
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::No VERCEL_TOKEN secret yet, so no staging deploy. See docs/staging-setup.md."

      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vercel builds it, not this runner: DATABASE_URL is a Secret in Vercel,
      # and Secrets are readable only inside Vercel's own build (`vercel pull`
      # hands them back empty). postbuild then migrates the staging database
      # and loads the demo data; if either fails, the build fails and the
      # previous deployment stays live.
      # Runtime: DB_DRIVER=auto uses DATABASE_URL when Vercel has it, and an
      # in-memory demo database (src/lib/db.ts) when it does not.
      # SEED_BUSY=yes, here and nowhere else: the demo seed also fills the
      # calendar with generated visits of fake clients (tools/seed-demo.mjs).
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI deploy --prod --build-env SEED_DEMO=yes --build-env SEED_BUSY=yes --env DB_DRIVER=auto --env SEED_DEMO=yes --env SEED_BUSY=yes --token "$VERCEL_TOKEN"

      - name: noindex on staging
        if: env.VERCEL_TOKEN != ''
        run: |
          for host in $DOMAIN $TRIAL_HOSTS; do
            if curl -s -o /dev/null --max-time 15 "https://$host/robots.txt"; then
              npm run check:noindex -- "https://$host"
            else
              echo "::warning::https://$host does not answer yet. Add the DNS record (docs/staging-setup.md)."
            fi
          done
