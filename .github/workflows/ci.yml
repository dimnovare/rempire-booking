name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: noindex on the built app
        run: |
          npx next start -p 3400 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3400/ && break; sleep 1; done
          npm run check:noindex -- http://localhost:3400

  # Staging deploy to Rempire's Vercel team (kickoff §11; Dim, 17.11.2026).
  # Dim's own Vercel login is not a member of that team, so CI deploys with a
  # token created on the team's account and scoped to the rempire-booking
  # project only (docs/staging-setup.md). The project and its domain were set
  # up in the dashboard; their IDs are repo variables, not secrets. Until the
  # VERCEL_TOKEN secret exists, this job only prints a notice.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DOMAIN: rempire-booking.diipsolutions.eu
      VERCEL_CLI: vercel@65.15.0
    steps:
      - name: Token check
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::No VERCEL_TOKEN secret yet, so no staging deploy. See docs/staging-setup.md."

      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.VERCEL_TOKEN != ''
        run: npm ci

      # postbuild migrates the staging database and loads the demo data when
      # DATABASE_URL is set in Vercel; until then it skips both.
      - name: Build
        if: env.VERCEL_TOKEN != ''
        env:
          SEED_DEMO: "yes"
        run: |
          npx --yes $VERCEL_CLI pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes $VERCEL_CLI build --prod --token "$VERCEL_TOKEN"

      # Staging only: DB_DRIVER=auto uses DATABASE_URL once Vercel has it, and
      # an in-memory demo database (src/lib/db.ts) until then.
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI deploy --prebuilt --prod --env DB_DRIVER=auto --env SEED_DEMO=yes --token "$VERCEL_TOKEN"

      - name: noindex on staging
        if: env.VERCEL_TOKEN != ''
        run: |
          if curl -s -o /dev/null --max-time 15 "https://$DOMAIN/robots.txt"; then
            npm run check:noindex -- "https://$DOMAIN"
          else
            echo "::warning::https://$DOMAIN does not answer yet. Add the DNS record (docs/staging-setup.md)."
          fi
