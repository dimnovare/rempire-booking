# The barber app on a real Android phone at BrowserStack (playwright.browserstack.config.ts).
# The keys come from the env vars BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY:
# never write them here.
projectName: REMPIRE booking
buildName: barber app, Galaxy
buildIdentifier: "${DATE_TIME}"
platforms:
  - deviceName: "Samsung Galaxy S24"
    osVersion: "14.0"
    browserName: chrome
parallelsPerPlatform: 1
# the e2e server runs on this computer, at bs-local.com
browserstackLocal: true
debug: true
consoleLogs: errors
testObservability: true
